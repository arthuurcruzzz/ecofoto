</style><aside><header><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="38" height="38" role="img" aria-label="Obturador com folha"><g fill="#bdf398" stroke="#142e29" stroke-width=".65"><g transform="rotate(60 15 15.5)"><path d="M15 3.5a12 12 0 0 1 9.1 4.2H14l-4.2 7.2z"/></g><g transform="rotate(120 15 15.5)"><path d="M15 3.5a12 12 0 0 1 9.1 4.2H14l-4.2 7.2z"/></g><g transform="rotate(180 15 15.5)"><path d="M15 3.5a12 12 0 0 1 9.1 4.2H14l-4.2 7.2z"/></g><g transform="rotate(240 15 15.5)"><path d="M15 3.5a12 12 0 0 1 9.1 4.2H14l-4.2 7.2z"/></g><g transform="rotate(300 15 15.5)"><path d="M15 3.5a12 12 0 0 1 9.1 4.2H14l-4.2 7.2z"/></g><path d="M14 10C13 3 20 1 29 1c-1 8-5 12-13 10l8-7z"/></g></svg> Eco Foto</header><small>WORKSPACE</small><button class="active" id="overview">▦　Visão geral</button><button id="events">▤　Eventos</button><button id="rules">◉　Divisão do lucro</button></aside><main><nav><span>Workspace　/　Financeiro</span><button class="demo" id="toggle"></button></nav><div class="row"><div><h1 id="title"></h1><p id="subtitle"></p></div><button class="primary" id="add">＋ Novo evento</button></div><div class="row"><b>Período</b><div><select id="month" aria-label="Mês"></select> <select id="year" aria-label="Ano"></select></div></div><div id="dashboard"><div class="cards" id="cards"></div><div class="panels"><section><h2>Evolução financeira</h2><small>● Faturamento　 <span style="color:#679644">● Lucro</span></small><div class="graph" id="graph"></div><div class="months" id="months"></div></section><section><div class="row"><h2>Divisão do lucro</h2><button id="edit" aria-label="Editar percentuais">✎</button></div><div class="ring" id="ring"><b>100%</b></div><div id="legend"></div></section></div></div><section><h2>Eventos do mês</h2><div class="scroll"><table><thead><tr><th>Evento</th><th>Data</th><th>Produção</th><th>Faturamento</th><th>Lucro</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><dialog id="modal"><form id="form"></form></dialog><script>
const $=id=>document.getElementById(id),now=new Date(),labels=['Reserva de emergência','Investimento','Salário'],colors=['#315741','#9cc575','#ecce86'],short='Jan Fev Mar Abr Mai Jun Jul Ago Set Out Nov Dez'.split(' '),money=v=>(v/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),safe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),key='eco-foto-v1';let db=JSON.parse(localStorage.getItem(key)||'{"items":[],"rates":[33.34,33.33,33.33]}'),demo=!localStorage.getItem(key),page=false;
const samples=Array.from({length:12},(_,i)=>[0,1].map((j)=>{let d=now.getFullYear()+'-'+String(i+1).padStart(2,'0')+'-'+(j?'15':'04');return {name:j?'Ensaio editorial':'Fotografia esportiva',start:d,end:d,cost:65000+i*2900,revenue:180000+((i*7+j*5)%13)*24000,rates:[33.34,33.33,33.33]}})).flat();
function save(){localStorage.setItem(key,JSON.stringify(db))}function parts(e){let v=Math.max(0,e.revenue-e.cost),r=e.rates||db.rates,a=Math.floor(v*r[0]/100),b=Math.floor(v*r[1]/100);return [a,b,v-a-b]}short.forEach((s,i)=>$('month').add(new Option(s,i)));$('month').value=now.getMonth();
function render(){let items=demo?samples:db.items,y=+$('year').value||now.getFullYear(),m=+$('month').value;let years=[...new Set([now.getFullYear(),y,...items.map(e=>+e.end.slice(0,4))])].sort();$('year').replaceChildren(...years.map(n=>new Option(n,n)));$('year').value=y;let annual=items.filter(e=>+e.end.slice(0,4)===y),monthly=annual.filter(e=>+e.end.slice(5,7)===m+1).sort((a,b)=>b.end.localeCompare(a.end));let sum=(arr,f)=>arr.reduce((s,e)=>s+f(e),0),rev=e=>e.revenue,profit=e=>e.revenue-e.cost,alloc=labels.map((_,i)=>sum(monthly,e=>parts(e)[i]));$('toggle').textContent=demo?'Dados de exemplo · Usar meus dados':'Ver demonstração';$('title').textContent=page?'Meus eventos':'Visão geral';$('subtitle').textContent=page?'Consulte os trabalhos e custos do período.':'Acompanhe o desempenho financeiro da sua fotografia.';$('dashboard').hidden=page;$('events').classList.toggle('active',page);$('overview').classList.toggle('active',!page);$('cards').innerHTML=['Faturamento','Lucro do mês','Investimento','Salário do mês'].map((s,i)=>'<article><i>'+['↗','◇','▥','▣'][i]+'</i><label>'+s+'</label><strong>'+money([sum(monthly,rev),sum(monthly,profit),alloc[1],alloc[2]][i])+'</strong></article>').join('');let stats=short.map((_,i)=>{let a=annual.filter(e=>+e.end.slice(5,7)===i+1);return [sum(a,rev),sum(a,profit)]}),max=Math.max(1,...stats.flat());$('graph').innerHTML=stats.map((a,i)=>'<button class="bar" aria-label="'+short[i]+'" title="'+short[i]+' · '+money(a[0])+'" onclick="selectMonth('+i+')">'+a.map(v=>'<i style="height:'+Math.max(0,v/max*95)+'%"></i>').join('')+'</button>').join('');$('months').innerHTML=short.map(s=>'<span>'+s+'</span>').join('');let rates=demo?[33.34,33.33,33.33]:db.rates,total=alloc.reduce((a,b)=>a+b,0),p=total?alloc.map(v=>100*v/total):rates;$('ring').style.background='conic-gradient('+colors[0]+' 0 '+p[0]+'%, '+colors[1]+' 0 '+(p[0]+p[1])+'%, '+colors[2]+' 0)';$('legend').innerHTML=labels.map((s,i)=>'<div class="line"><span><i class="dot" style="background:'+colors[i]+'"></i>'+s+'</span><b>'+money(alloc[i])+'</b></div>').join('');let date=d=>d.split('-').reverse().slice(0,2).join('/');$('rows').innerHTML=monthly.map(e=>'<tr><td><b>'+safe(e.name)+'</b></td><td>'+date(e.start)+(e.start===e.end?'':' – '+date(e.end))+'</td><td>'+money(e.cost)+'</td><td>'+money(e.revenue)+'</td><td>'+money(profit(e))+'</td></tr>').join('')||'<tr><td colspan="5">Nenhum evento neste mês.</td></tr>'}
function selectMonth(i){$('month').value=i;render()}$('month').onchange=$('year').onchange=render;$('toggle').onclick=()=>{demo=!demo;if(!demo)save();render()};$('overview').onclick=()=>{page=false;render()};$('events').onclick=()=>{page=true;render()};
function openForm(title,fields,submit){$('form').innerHTML='<h2>'+title+'</h2>'+fields+'<div class="row"><button type="button" onclick="modal.close()">Cancelar</button><button class="primary">Salvar</button></div>';$('form').onsubmit=e=>{e.preventDefault();if(submit(new FormData(e.target))===false)return;demo=false;save();$('modal').close();render()};$('modal').showModal()}
const field=(name,label,type,attrs='')=>'<label>'+label+'<input required name="'+name+'" type="'+type+'" '+attrs+'></label>';
$('rules').onclick=$('edit').onclick=()=>openForm('Divisão do lucro','<small>Os percentuais devem somar 100%. A divisão vale para os próximos eventos.</small>'+labels.map((s,i)=>field('p'+i,s+' (%)','number','step=".01" min="0" max="100" value="'+db.rates[i]+'"')).join(''),f=>{let r=labels.map((_,i)=>+f.get('p'+i));if(Math.round(r.reduce((a,b)=>a+b,0)*100)!==10000){alert('A soma precisa ser 100%.');return false}db.rates=r});
$('add').onclick=()=>{openForm('Novo evento',field('name','Nome do evento','text','maxlength="140"')+field('start','Primeiro dia','date')+'<label>Último dia (opcional)<input name="end" type="date"></label>'+field('cost','Custo de produção (R$)','number','min="0" step=".01"')+field('revenue','Faturamento final (R$)','number','min="0" step=".01"')+'<small>O evento entra no mês do último dia fotografado.</small><p id="preview"></p>',f=>{let e=Object.fromEntries(f);e.end=e.end||e.start;if(e.end<e.start){alert('Confira a data final.');return false}e.cost=Math.round(e.cost*100);e.revenue=Math.round(e.revenue*100);e.rates=[...db.rates];db.items.push(e);let y=+e.end.slice(0,4);if(!Array.from($('year').options).some(o=>+o.value===y))$('year').add(new Option(y,y));$('year').value=y;$('month').value=+e.end.slice(5,7)-1});$('form').oninput=()=>{if($('preview'))$('preview').textContent='Lucro do evento · '+money(Math.round(($('form').revenue.value-$('form').cost.value)*100))}};render()
</script></html>
